<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام تسجيل الطلاب</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-image: url(src/pic1.jfif); background-size: cover; background-attachment: fixed;">
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #371d3799;">
        <div class="container" style="justify-content: center;">
            <a class="navbar-brand" href="index.html">نظام تسجيل الطلاب</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <div class="container">
        <div class="form-box" style="background-color: #371d3799; border: 1px solid rgba(255,255,255,0.25); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); color: #fff;">
            <h3 class="text-center mb-4">تسجيل الدخول</h3>
            
            <div id="msg-box"></div>

            <form action="login.php" method="POST" onsubmit="return checkLoginForm()">
                <div class="mb-3">
                    <label for="user_input" class="form-label">اسم المستخدم أو البريد الإلكتروني</label>
                    <input type="text" class="form-control" id="user_input" name="user_input" placeholder="أدخل اسم المستخدم أو البريد الإلكتروني">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">كلمة المرور</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="أدخل كلمة المرور">
                </div>

                <button type="submit" class="btn w-100" style="background-color: #1e0a1e; color: #fff;">دخول</button>
            </form>

            <div class="text-center mt-3">
                <p>ليس لديك حساب؟ <a href="register.html" style="color: #a085a0;">إنشاء حساب جديد</a></p>
            </div>
        </div>
    </div>

    <div class="table-container">
        <div class="table-box" style="background-color: #371d3799; border: 1px solid rgba(255,255,255,0.25); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); color: #fff; max-width: 550px; width: 100%; margin: 25px auto 0; padding: 25px 20px 20px; border-radius: 8px;">
            <h3 class="text-center mb-4">جدول الطلاب</h3>

            <table class="table table-bordered mb-0 text-center" style="width: 100%; margin: 0; background-color: rgba(255,255,255,0.08); color: #fff; border-color: rgba(255,255,255,0.25);">
                <thead>
                    <tr>
                        <th style="background-color: rgba(30,10,30,0.7); border-color: rgba(255,255,255,0.25); color: #fff;">#</th>
                        <th style="background-color: rgba(30,10,30,0.7); border-color: rgba(255,255,255,0.25); color: #fff;">الاسم</th>
                        <th style="background-color: rgba(30,10,30,0.7); border-color: rgba(255,255,255,0.25); color: #fff;">ID</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="border-color: rgba(255,255,255,0.25);">1</td>
                        <td style="border-color: rgba(255,255,255,0.25);">صبا شباط</td>
                        <td style="border-color: rgba(255,255,255,0.25);">siba_292910</td>
                    </tr>
                    <tr>
                        <td style="border-color: rgba(255,255,255,0.25);">2</td>
                        <td style="border-color: rgba(255,255,255,0.25);">بتول ابو الكاس</td>
                        <td style="border-color: rgba(255,255,255,0.25);">batool_355143</td>
                    </tr>
                    <tr>
                        <td style="border-color: rgba(255,255,255,0.25);">3</td>
                        <td style="border-color: rgba(255,255,255,0.25);">محمد عدنان صالح</td>
                        <td style="border-color: rgba(255,255,255,0.25);">mohammed_adnan_306716</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        var urlParams = new URLSearchParams(window.location.search);
        var msgBox = document.getElementById('msg-box');

        if (urlParams.has('error')) {
            var err = urlParams.get('error');
            var text = "فشل تسجيل الدخول! يرجى التأكد من البيانات.";
            if (err == 'empty') text = "يرجى ملء جميع الحقول.";
            if (err == 'wrongpass') text = "كلمة المرور غير صحيحة! حاول مرة أخرى.";
            if (err == 'nouser') text = "لا يوجد حساب مسجل بهذا الاسم أو البريد الإلكتروني.";
            if (err == 'auth') text = "يرجى تسجيل الدخول أولاً للوصول إلى تلك الصفحة.";
            
            msgBox.innerHTML = '<div class="alert alert-danger">' + text + '</div>';
        }

        if (urlParams.has('registered')) {
            msgBox.innerHTML = '<div class="alert alert-success">تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول.</div>';
        }

        if (urlParams.has('logout')) {
            msgBox.innerHTML = '<div class="alert alert-info">تم تسجيل الخروج بنجاح.</div>';
        }

        function checkLoginForm() {
            var u = document.getElementById('user_input').value.trim();
            var p = document.getElementById('password').value.trim();
            if (u === "" || p === "") {
                msgBox.innerHTML = '<div class="alert alert-danger">يرجى إدخال اسم المستخدم/البريد وكلمة المرور.</div>';
                return false;
            }
            return true;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
