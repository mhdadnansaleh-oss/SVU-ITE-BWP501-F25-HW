<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام تسجيل الطلاب</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-image: url(src/pic1.jfif); background-size: cover; background-attachment: fixed;">
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #371d3799;">
        <div class="container" style="justify-content: center;">
            <a class="navbar-brand" href="index.html">نظام تسجيل الطلاب</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <div class="container">
        <div class="form-box" style="background-color: #371d3799; border: 1px solid rgba(255,255,255,0.25); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); color: #fff;">
            <h3 class="text-center mb-4">إنشاء حساب جديد</h3>

            <div id="msg-box"></div>

            <form action="register.php" method="POST" onsubmit="return validateRegister()">
                <div class="mb-3">
                    <label for="username" class="form-label">اسم المستخدم</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="اختر اسم مستخدم">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">البريد الإلكتروني</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="example@mail.com">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">كلمة المرور</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="6 محارف على الأقل">
                </div>

                <div class="mb-3">
                    <label for="confirm_password" class="form-label">تأكيد كلمة المرور</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="أعد كتابة كلمة المرور">
                </div>

                <button type="submit" class="btn w-100" style="background-color: #1e0a1e; color: #fff;">تسجيل الحساب</button>
            </form>

            <div class="text-center mt-3">
                <p>لديك حساب بالفعل؟ <a href="index.html" style="color: #a085a0;">سجل الدخول من هنا</a></p>
            </div>
    </div>

    <script>
        var urlParams = new URLSearchParams(window.location.search);
        var msgBox = document.getElementById('msg-box');

        if (urlParams.has('error')) {
            var err = urlParams.get('error');
            var text = "فشل تسجيل الدخول! يرجى التأكد من البيانات.";
            if (err == 'empty') text = "يرجى ملء جميع الحقول.";
            if (err == 'wrongpass') text = "كلمة المرور غير صحيحة! حاول مرة أخرى.";
            if (err == 'nouser') text = "لا يوجد حساب مسجل بهذا الاسم أو البريد الإلكتروني.";
            if (err == 'auth') text = "يرجى تسجيل الدخول أولاً للوصول إلى تلك الصفحة.";
            
            msgBox.innerHTML = '<div class="alert alert-danger">' + text + '</div>';
        }

        if (urlParams.has('registered')) {
            msgBox.innerHTML = '<div class="alert alert-success">تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول.</div>';
        }

        if (urlParams.has('logout')) {
            msgBox.innerHTML = '<div class="alert alert-info">تم تسجيل الخروج بنجاح.</div>';
        }

        function checkLoginForm() {
            var u = document.getElementById('user_input').value.trim();
            var p = document.getElementById('password').value.trim();
            if (u === "" || p === "") {
                msgBox.innerHTML = '<div class="alert alert-danger">يرجى إدخال اسم المستخدم/البريد وكلمة المرور.</div>';
                return false;
            }
            return true;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
