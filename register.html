<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - نظام تسجيل الطلاب</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">نظام تسجيل الطلاب (BWP501)</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">تسجيل الدخول</a></li>
                    <li class="nav-item"><a class="nav-link active" href="register.html">إنشاء حساب</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="form-box">
            <h3 class="text-center mb-4">إنشاء حساب جديد</h3>

            <div id="msg-box"></div>

            <form action="register.php" method="POST" onsubmit="return validateRegister()">
                <div class="mb-3">
                    <label for="username" class="form-label">اسم المستخدم</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="اختر اسم مستخدم">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">البريد الإلكتروني</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="example@mail.com">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">كلمة المرور</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="6 محارف على الأقل">
                </div>

                <div class="mb-3">
                    <label for="confirm_password" class="form-label">تأكيد كلمة المرور</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="أعد كتابة كلمة المرور">
                </div>

                <button type="submit" class="btn btn-primary w-100">تسجيل الحساب</button>
            </form>

            <div class="text-center mt-3">
                <p>لديك حساب بالفعل؟ <a href="login.html">سجل الدخول من هنا</a></p>
            </div>
        </div>
    </div>

    <script>
        var urlParams = new URLSearchParams(window.location.search);
        var msgBox = document.getElementById('msg-box');

        if (urlParams.has('error')) {
            var err = urlParams.get('error');
            var text = "فشل إنشاء الحساب!";
            if (err == 'empty') text = "جميع الحقول مطلوبة.";
            if (err == 'nomatch') text = "كلمتا المرور غير متطابقتين!";
            if (err == 'exists') text = "اسم المستخدم أو البريد الإلكتروني مستخدم مسبقاً!";
            if (err == 'db') text = "حدث خطأ في قاعدة البيانات، حاول مرة أخرى.";

            msgBox.innerHTML = '<div class="alert alert-danger">' + text + '</div>';
        }

        function validateRegister() {
            var username = document.getElementById('username').value.trim();
            var email = document.getElementById('email').value.trim();
            var pass = document.getElementById('password').value;
            var confirmPass = document.getElementById('confirm_password').value;

            if (username === "" || email === "" || pass === "" || confirmPass === "") {
                msgBox.innerHTML = '<div class="alert alert-danger">يرجى ملء جميع الحقول!</div>';
                return false;
            }

            if (pass.length < 6) {
                msgBox.innerHTML = '<div class="alert alert-danger">كلمة المرور يجب أن تكون 6 محارف على الأقل.</div>';
                return false;
            }

            if (pass !== confirmPass) {
                msgBox.innerHTML = '<div class="alert alert-danger">كلمتا المرور غير متطابقتين!</div>';
                return false;
            }

            return true;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
