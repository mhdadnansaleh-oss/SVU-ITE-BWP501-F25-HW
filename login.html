<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام تسجيل الطلاب</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">نظام تسجيل الطلاب (BWP501)</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
                    <li class="nav-item"><a class="nav-link active" href="login.html">تسجيل الدخول</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html">إنشاء حساب</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="form-box">
            <h3 class="text-center mb-4">تسجيل الدخول</h3>
            
            <!-- مكان عرض رسائل الخطأ أو التنبيهات -->
            <div id="msg-box"></div>

            <form action="login.php" method="POST" onsubmit="return checkLoginForm()">
                <div class="mb-3">
                    <label for="user_input" class="form-label">اسم المستخدم أو البريد الإلكتروني</label>
                    <input type="text" class="form-control" id="user_input" name="user_input" placeholder="أدخل اسم المستخدم أو البريد الإلكتروني">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">كلمة المرور</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="أدخل كلمة المرور">
                </div>

                <button type="submit" class="btn btn-primary w-100">دخول</button>
            </form>

            <div class="text-center mt-3">
                <p>ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a></p>
            </div>
        </div>
    </div>

    <script>
        // قراءة رسائل الخطأ من الرابط (URL)
        var urlParams = new URLSearchParams(window.location.search);
        var msgBox = document.getElementById('msg-box');

        if (urlParams.has('error')) {
            var err = urlParams.get('error');
            var text = "فشل تسجيل الدخول! يرجى التأكد من البيانات.";
            if (err == 'empty') text = "يرجى ملء جميع الحقول.";
            if (err == 'wrongpass') text = "كلمة المرور غير صحيحة! حاول مرة أخرى.";
            if (err == 'nouser') text = "لا يوجد حساب مسجل بهذا الاسم أو البريد الإلكتروني.";
            if (err == 'auth') text = "يرجى تسجيل الدخول أولاً للوصول إلى تلك الصفحة.";
            
            msgBox.innerHTML = '<div class="alert alert-danger">' + text + '</div>';
        }

        if (urlParams.has('registered')) {
            msgBox.innerHTML = '<div class="alert alert-success">تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول.</div>';
        }

        if (urlParams.has('logout')) {
            msgBox.innerHTML = '<div class="alert alert-info">تم تسجيل الخروج بنجاح.</div>';
        }

        function checkLoginForm() {
            var u = document.getElementById('user_input').value.trim();
            var p = document.getElementById('password').value.trim();
            if (u === "" || p === "") {
                msgBox.innerHTML = '<div class="alert alert-danger">يرجى إدخال اسم المستخدم/البريد وكلمة المرور.</div>';
                return false;
            }
            return true;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
